[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motion-adaptive-hierarchical-network"
version = "0.1.0"
description = "Minimal motion-adaptive hierarchical network for skeleton-based video anomaly detection"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "torch>=2.7,<3"]

[project.scripts]
motion-adaptive = "motion_adaptive.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
motion_adaptive = ["config.json"]
